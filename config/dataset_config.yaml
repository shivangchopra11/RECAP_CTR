# Raw csv files live in ../data/<name>/ and are shared by all experiments.
# `python run_expid.py --expid <expid> --build_data` fits the feature map on raw_*_data and
# writes feature_map.json + {train,valid,test}.npz to <data_root>/<dataset_id>/ (once).
# Experiments load that npz into memory (rebuild_dataset: False), so tuner sweeps never rebuild.

Criteo_x4_10:
    data_root: ../data/
    data_format: npz
    rebuild_dataset: False
    train_data: ../data/Criteo_x4_10/train.npz
    valid_data: ../data/Criteo_x4_10/valid.npz
    test_data: ../data/Criteo_x4_10/test.npz
    raw_train_data: ../data/criteo/train.csv
    raw_valid_data: ../data/criteo/valid.csv
    raw_test_data: ../data/criteo/test.csv
    feature_processor: criteo   # fuxictr.datasets.criteo: convert_to_bucket
    min_categr_count: 10
    feature_cols:
    -   active: true
        dtype: float
        fill_na: 0
        name: [I1, I2, I3, I4, I5, I6, I7, I8, I9, I10, I11, I12, I13]
        preprocess: convert_to_bucket
        type: categorical
    -   active: true
        dtype: str
        fill_na: ''
        name: [C1, C2, C3, C4, C5, C6, C7, C8, C9, C10, C11, C12, C13, C14, C15, C16,
            C17, C18, C19, C20, C21, C22, C23, C24, C25, C26]
        type: categorical
    label_col: {dtype: float, name: Label}

# ------------------------------------------------------------------
# Other benchmarks of the FCN paper (feature definitions of the original FCN repo configs;
# raw csv: BARS Avazu_x4 and KKBox_x1; ML-1M and KDD12 splits as prepared in CTR_ICLR/final)
# ------------------------------------------------------------------
Avazu_x4:
    data_root: ../data/
    data_format: npz
    rebuild_dataset: False
    train_data: ../data/Avazu_x4/train.npz
    valid_data: ../data/Avazu_x4/valid.npz
    test_data: ../data/Avazu_x4/test.npz
    raw_train_data: ../data/avazu/train.csv
    raw_valid_data: ../data/avazu/valid.csv
    raw_test_data: ../data/avazu/test.csv
    feature_processor: avazu    # fuxictr.datasets.avazu: convert_hour / convert_weekday / convert_weekend
    min_categr_count: 2
    feature_cols:
    - {active: false, dtype: str, name: id, type: categorical}
    - {active: true, dtype: str, name: hour, preprocess: convert_hour, type: categorical}
    -   active: true
        dtype: str
        name: [C1, banner_pos, site_id, site_domain, site_category, app_id, app_domain, app_category, device_id,
            device_ip, device_model, device_type, device_conn_type, C14, C15, C16, C17, C18, C19, C20, C21]
        type: categorical
    - {active: true, dtype: str, name: weekday, preprocess: convert_weekday, type: categorical}
    - {active: true, dtype: str, name: weekend, preprocess: convert_weekend, type: categorical}
    label_col: {dtype: float, name: click}

KKBox_x1:
    data_root: ../data/
    data_format: npz
    rebuild_dataset: False
    train_data: ../data/KKBox_x1/train.npz
    valid_data: ../data/KKBox_x1/valid.npz
    test_data: ../data/KKBox_x1/test.npz
    raw_train_data: ../data/kkbox/train.csv
    raw_valid_data: ../data/kkbox/valid.csv
    raw_test_data: ../data/kkbox/test.csv
    feature_processor: kkbox    # fuxictr.datasets.kkbox: extract_country_code / bucketize_age
    min_categr_count: 10
    feature_cols:
    -   active: true
        dtype: str
        name: [msno, song_id, source_system_tab, source_screen_name, source_type, city, gender, registered_via, language]
        type: categorical
    - {active: true, dtype: str, encoder: MaskedSumPooling, max_len: 3, name: genre_ids, type: sequence}   # official config (no splitter): vocab as the authors
    - {active: true, dtype: str, encoder: MaskedSumPooling, max_len: 3, name: artist_name, type: sequence}
    - {active: true, dtype: str, name: isrc, preprocess: extract_country_code, type: categorical}
    - {active: true, dtype: str, name: bd, preprocess: bucketize_age, type: categorical}
    label_col: {dtype: float, name: label}

ML_1M_7_x1:
    data_root: ../data/
    data_format: npz
    rebuild_dataset: False
    train_data: ../data/ML_1M_7_x1/train.npz
    valid_data: ../data/ML_1M_7_x1/valid.npz
    test_data: ../data/ML_1M_7_x1/test.npz
    raw_train_data: ../data/ml1m/train.csv
    raw_valid_data: ../data/ml1m/valid.csv
    raw_test_data: ../data/ml1m/test.csv
    min_categr_count: 1
    feature_cols:
    -   active: true
        dtype: str
        name: [UserID, Gender, Age, Occupation, MovieID, Release]
        type: categorical
    - {active: true, dtype: str, encoder: MaskedSumPooling, max_len: 5, name: Genres, type: sequence, splitter: "|"}
    label_col: {dtype: float, name: Label}

KDD12_x10:
    data_root: ../data/
    data_format: npz
    rebuild_dataset: False
    train_data: ../data/KDD12_x10/train.npz
    valid_data: ../data/KDD12_x10/valid.npz
    test_data: ../data/KDD12_x10/test.npz
    raw_train_data: ../data/kdd12/train.csv
    raw_valid_data: ../data/kdd12/valid.csv
    raw_test_data: ../data/kdd12/test.csv
    feature_processor: criteo   # convert_to_bucket
    min_categr_count: 10
    binarize_label: True        # Click is a click count; label = Click > 0 (as BARS KDD12_x10)
    feature_cols:
    -   active: true
        dtype: float
        name: [Depth, Position, Impression]
        preprocess: convert_to_bucket
        type: categorical
    -   active: true
        dtype: float
        name: [DisplayURL, AdID, AdvertiserID, QueryID, KeywordID, TitleID, DescriptionID, UserID, Gender, Age]
        type: categorical
    label_col: {dtype: float, name: Click}
