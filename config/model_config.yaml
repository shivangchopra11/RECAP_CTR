Base:
    model_root: './checkpoints/'
    num_workers: 8
    verbose: 0              # 1 = tqdm progress bars (noisy in Slurm logs)
    early_stop_patience: 2
    pickle_feature_encoder: True
    save_best_only: True
    eval_steps: null
    debug_mode: False
    group_id: null
    use_features: null
    feature_specs: null
    feature_config: null
    wandb: {project: fcn-ctr, entity: null, mode: online, train_metrics: True}
    save_train_pred: False  # True: also save row-aligned train-set predictions (distillation teacher)

# ==================================================================
# Criteo_x4_10 -- FCN_sp (FCNv2) with the paper's reported Criteo layers
# (Sec. 6.3.3: 4 ECN + 2 LCN; author log FCNv2_Criteo_017: test AUC 0.816352)
# ==================================================================

FCNv2_Criteo_x4_10_E4L2:
    model: FCNv2
    dataset_id: Criteo_x4_10
    loss: 'binary_crossentropy'
    metrics: ['logloss', 'AUC']
    task: binary_classification
    optimizer: adam
    learning_rate: 1.e-3
    embedding_regularizer: 1.e-5
    net_regularizer: 0
    batch_size: 8192
    embedding_dim: 16
    exp_num_layers: 4
    lin_num_layers: 2
    net_dropout: 0.1
    batch_norm: False
    num_heads: 1
    epochs: 100
    shuffle: True
    seed: 2025
    monitor: {'AUC': 1, 'logloss': 0}
    monitor_mode: 'max'

FCNv2_Criteo_x4_10_E4L2_EMA:
    model: FCNv2
    dataset_id: Criteo_x4_10
    loss: 'binary_crossentropy'
    metrics: ['logloss', 'AUC']
    task: binary_classification
    optimizer: adam
    learning_rate: 1.e-3
    embedding_regularizer: 1.e-5
    net_regularizer: 0
    batch_size: 8192
    embedding_dim: 16
    exp_num_layers: 4
    lin_num_layers: 2
    net_dropout: 0.1
    batch_norm: False
    num_heads: 1
    epochs: 100
    shuffle: True
    seed: 2025
    monitor: {'AUC': 1, 'logloss': 0}
    monitor_mode: 'max'
    ema_decay: 0.9995
    ema_scope: all
    lr_schedule: cosine
    cosine_epochs: 20
    lr_min: 1.e-5
    reduce_lr_on_plateau: False
    early_stop_patience: 4

