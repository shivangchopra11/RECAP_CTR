# and the recursive model with the per-dataset settings of CTR_ICLR/final. KD teacher per dataset:
# teacher_fcnsp_5seed = mean logit of FCNv2_<dataset>_00* (config/tuner/FCNv2_<dataset>_seeds.yaml).
# ==================================================================

