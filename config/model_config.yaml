# ------------------------------------------------------------------
# Anytime recursive cross network (RRT / RECAP, MultiTowerRecursiveFCNv2 of CTR_ICLR/final,
# configs/base/rrt_pair.yaml incl. the refresh block), vendored in src/recap_rrt via src/RecursiveFCN.py.
# KD teacher: the FCN_sp (exp 4 / lin 2) 5-seed ensemble. Route aggregation: scripts/route_fusion.py.
# ------------------------------------------------------------------

RecursiveFCN_Criteo_x4_10:
    model: RecursiveFCN
    dataset_id: Criteo_x4_10
    loss: 'binary_crossentropy'
    metrics: ['logloss', 'AUC']
    task: binary_classification
    optimizer: adam
    learning_rate: 1.e-3
    embedding_regularizer: 1.e-5
    net_regularizer: 0
    batch_size: 8192
    embedding_dim: 16
    net_dropout: 0.1
    num_heads: 1
    layer_norm: false
    max_gradient_norm: 10.0
    epochs: 100
    shuffle: True
    seed: 2025
    monitor: {'AUC': 1, 'logloss': 0}
    monitor_mode: 'max'
    early_stop_patience: 2
    reduce_lr_on_plateau: True
    rrt_eval_steps: 8          # reference eval_steps: rollout depth of the evaluation forward
    tower_specs:
    - {direction: e2l, name: e2l, pattern: EEELLLLL}
    - {direction: l2e, name: l2e, pattern: LLLLLEEE}
    step_mlp_hidden: 512
    step_mlp_every: 2
    anytime_bce_weight: 0.0
    anytime_depth_decay: 1.0
    anytime_supervision_depths: [4, 6, 8, 10, 12, 16]
    aux_log_every: 200
    budget_condition_phase: false
    budget_condition_router: true
    budget_condition_update: true
    budget_max_hint: 32
    cross_budget_margin_delta: 0.01
    cross_budget_progressive_weight: 0.01
    cross_budget_uncertain_margin: 2.0
    cross_norm: true
    cross_norm_cap: 10000.0
    depth_slot_size: 0
    depth_step_init: 1.0
    depth_step_max: 2.0
    depth_step_size: 0
    embedding_lr_mult: 1.0
    eta_late_weight: 0.0
    exp_num_layers: 3
    halt_compute_cost: 0.01
    halt_eval_mode: fixed
    halt_hidden_dim: 32
    halt_lr_mult: 1.0
    halt_min_steps: 2
    halt_oracle_weight: 0.0
    halt_ponder_weight: 0.0
    halt_threshold: 0.5
    lin_num_layers: 5
    lora_bank_mode: shared
    lora_bank_size: 8
    lora_lr_mult: 2.0
    lora_rank: 96
    lora_router_hidden_dim: 64
    lora_router_mode: state_depth
    lora_router_temperature: 1.0
    lora_router_top_k: 2
    lr_scheduler: null
    multi_budget_choices: [4, 8, 12]
    multi_budget_depth_decay: 1.0
    multi_budget_sample_count: 3
    multi_budget_training: true
    num_towers: 2
    other_lr_mult: 1.0
    phase_gate_mode: fixed_schedule
    phase_hidden_dim: 64
    phase_lr_mult: 1.0
    phase_time_scale_init: 12.0
    progressive_margin_delta: 0.01
    progressive_margin_weight: 0.0
    progressive_uncertain_margin: 2.0
    rarity_table_path: null
    route_dropout_family: drop1
    route_dropout_prob: 0.5
    router_balance_weight: 0.0
    router_entropy_weight: 0.0
    shared_lr_mult: 1.0
    stability_ratio_target: 1.0
    stability_ratio_weight: 0.0
    track_anytime: true
    train_depth_choices: [4, 8, 12]
    train_depth_mode: random_target
    train_max_steps: 12
    train_min_steps: 4
    update_eta_init: 0.98
    update_eta_max: 1.0
    update_hidden_dim: 64
    update_lr_mult: 2.0
    use_halting_head: false
    use_update_gate: true

